# Réglages du compte Midad. Modifiable sans toucher au code.

compte: "@midad.coran"

recitateur:
  id: ar.alafasy            # identifiant sur api.alquran.cloud
  nom: Mishary Rashid Alafasy

traduction:
  id: fr.hamidullah
  nom: Muhammad Hamidullah

publication:
  heure: "18:30"            # heure de Paris
  depot_videos: ""          # dépôt public qui héberge les vidéos pour Buffer (vide = ce dépôt)

decoupage:
  duree_min: 60             # secondes
  duree_max: 180

# Contrôle par reconnaissance vocale. Calibrage sur 58 versets : le bon verset obtient
# au moins 0,93, un mauvais verset au plus 0,77.
ecoute:
  active: true
  seuil: 0.85

legende:
  hashtags: ["#coran", "#quran", "#recitation"]   # un hashtag au nom de la sourate est ajouté
  longueur_max: 2200

# Ordre de la progression principale : sourates courtes et connues d'abord,
# puis le reste de Juz Amma, puis les autres.
ordre:
  - [1, 112, 113, 114]
  - {de: 78, a: 111}
  - {de: 2, a: 77}

# Le vendredi, une partie d'Al-Kahf, sans faire avancer la progression principale.
vendredi:
  sourate: 18

# Pendant le Ramadan, ces passages passent avant la progression principale
# (liste proposée, à valider). Une fois la liste épuisée, la progression reprend.
ramadan:
  - {sourate: 2, versets: [183, 186]}   # le jeûne
  - {sourate: 2, versets: [187, 187]}
  - {sourate: 97, versets: [1, 5]}      # la nuit du Destin
  - {sourate: 44, versets: [1, 8]}      # la nuit bénie
  - {sourate: 2, versets: [255, 255]}   # verset du Trône
  - {sourate: 2, versets: [285, 286]}
  - {sourate: 3, versets: [190, 194]}
  - {sourate: 39, versets: [53, 55]}    # la miséricorde
  - {sourate: 25, versets: [63, 70]}    # les serviteurs du Tout Miséricordieux
  - {sourate: 59, versets: [21, 24]}
